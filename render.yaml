services:
  - type: web
    name: mcp-chatbot
    env: docker
    dockerfilePath: ./dockerfile
    plan: starter # Persistent disks require Starter plan ($7/mo) or above on Render
    disk:
      name: sqlite-storage
      mountPath: /var/lib/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/lib/data/chatbot.db
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
